   ===================================================================== */
const SETS = [

<style>

  .status { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; align-items: center; margin: .4rem 0 .8rem; }

  .opt {
    display: flex; align-items: flex-start; gap: .8rem; text-align: left;

  }
  .opt:hover:not([aria-disabled="true"]) { border-color: var(--muted); }
  .opt .letter {
    flex: none; width: 2rem; height: 2rem; border-radius: 6px; display: grid; place-items: center;

  }

  .score-big small { font-size: 1.6rem; color: var(--muted); }

  .breakdown th, .breakdown td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }

  .breakdown td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .code-box {
    font-family: ui-monospace, Consolas, monospace; font-size: 3rem; font-weight: 900; letter-spacing: .25em;
    background: #000; border: 3px dashed var(--amber); color: var(--amber); border-radius: 12px;
    padding: 1rem; text-align: center; margin: .6rem 0; word-break: break-all;

  .debrief { font-size: 1.25rem; font-style: italic; border-left: 6px solid var(--red); padding-left: 1rem; }

</style>

<body>
<header class="masthead">
  <div class="bar">
    <div class="breaking"><span class="dot" aria-hidden="true"></span>BREAKING</div>
    <div class="brand">CYBER<span>&nbsp;NEWS</span></div>
    <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div id="live" class="sr-only" aria-live="assertive"></div>

<script>
(function () {
  "use strict";

  const app = document.getElementById("app");
  const live = document.getElementById("live");
  const LETTERS = ["A", "B", "C", "D"];

  /* ---------- ticker ---------- */
  document.getElementById("ticker").innerHTML = [
    "Stryker devices wiped overnight", "Canvas login pages defaced during finals",
    "Supply chain campaign hits security tooling", "FBI declares major cyber incident",
    "Instagram accounts hijacked", "Toymaker offline for weeks", "Polish utilities breached"
  ].map(h => "<b>●</b>" + h).join(" ");

  /* ---------- state ---------- */
  const state = {
    screen: "start",   // start | play | final
    setIdx: 0,         // the one set this team plays, drawn at random on Start
    cur: 0,            // index of active question in current set
    qs: [],            // per-question runtime state for the current set
    flash: null        // { text, kind }
  };

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function newQState(q) {
    return {
      q,
      selected: null,       // option id currently chosen (not yet judged)
      solved: false,        // locked-correct
      wrong: 0,             // wrong attempts (one per wrong submit)
      tried: new Set(),     // option ids already judged wrong
      showHint: false,
      order: shuffle(q.options.map(o => o.id))
    };
  }

  // Net score for one question: +3 once solved, -1 per wrong attempt, never below 0.
  function qScore(s) {
    return Math.max(0, (s.solved ? POINTS_CORRECT : 0) - PENALTY_WRONG * s.wrong);
  }
  function setScore() { return state.qs.reduce((t, s) => t + qScore(s), 0); }

  function rankFor(score, max) {
    // Thresholds from the spec are for 15; scale proportionally for other maxima.
    const r = score / max;
    if (score === max) return "Threat Hunter";
    if (r >= 12 / 15) return "Security Analyst";
    if (r >= 8 / 15) return "Help Desk Hero";
    return "Click-the-Link Champion";
  }

  function announce(text) {
    live.textContent = "";
    setTimeout(() => { live.textContent = text; }, 30);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- screens ---------- */
  function renderStart() {
    state.screen = "start";
    app.innerHTML = `
      <h1><span class="kicker">Game 3 · Cyber Escape Room</span>Breaking News: Cyber Edition</h1>
      <p class="muted" style="font-size:1.15rem">Real 2026 cyber incidents. Your team gets five questions from a set drawn at random. Every story is about trust gone wrong.</p>
      <div class="rules">
        <section class="card">
          <h2>How to play</h2>
          <ul>
            <li>Answer all 5 questions in a set, then press <b>Submit</b>.</li>
            <li>Correct answers lock in <b>green ✔</b>.</li>
            <li>Got some wrong? You're sent back to the first wrong one, with a hint. Fix them and submit again.</li>
            <li>Get all 5 right to get the code.</li>
            <li>🔥 marks the harder questions.</li>
          </ul>
        </section>
        <section class="card">
          <h2>Scoring</h2>
          <ul>
            <li><b>+3</b> for each question once you get it right.</li>
            <li><b>−1</b> for every wrong attempt on it.</li>
            <li>A question can't go below <b>0</b>.</li>
            <li>Max score <b>15</b>.</li>
          </ul>
        </section>
        <section class="card">
          <h2>Keyboard</h2>
          <ul>
            <li><span class="kbd">A</span>–<span class="kbd">D</span> pick an answer</li>
            <li><span class="kbd">1</span>–<span class="kbd">5</span> jump to a question</li>
            <li><span class="kbd">←</span> <span class="kbd">→</span> previous / next</li>
            <li><span class="kbd">Enter</span> submit the set</li>
          </ul>
        </section>
      </div>
      <p style="margin-top:1.4rem"><button class="btn primary big" id="startBtn">Start: draw a random set →</button></p>`;
    document.getElementById("startBtn").onclick = () => startSet(Math.floor(Math.random() * SETS.length));
    document.getElementById("startBtn").focus();
  }

  /* ---------- Escape Hub bridge (no-op when played standalone) ---------- */
  function reportToHub(r) {
    try { if (window.parent !== window) window.parent.postMessage(Object.assign({ type: "escape-hub:result", puzzle: 3 }, r), "*"); } catch (_) {}
  }

  function startSet(idx) {
    state.startedAt = Date.now();
    state.setIdx = idx;
    state.cur = 0;
    state.qs = SETS[idx].questions.map(newQState);
    state.flash = null;
    state.screen = "play";
    renderPlay(true);
    app.focus();
  }

  // reshuffle=true when the question is (re)displayed, i.e. navigated to.
  function goTo(i) {
    state.cur = i;
    const s = state.qs[i];
    if (!s.solved) s.order = shuffle(s.q.options.map(o => o.id));
    renderPlay(false);
  }

  function renderPlay(reshuffleCurrent) {
    const set = SETS[state.setIdx];
    const s = state.qs[state.cur];
    if (reshuffleCurrent && !s.solved) s.order = shuffle(s.q.options.map(o => o.id));
    const solvedCount = state.qs.filter(x => x.solved).length;
    const allChosen = state.qs.every(x => x.solved || x.selected !== null);

    const pills = state.qs.map((x, i) => {
      let cls = "", label = "";
      if (x.solved) { cls = "solved"; label = "✔"; }
      else if (x.showHint && x.selected === null) { cls = "wrong"; label = "✖"; }
      else if (x.selected !== null) { cls = "answered"; label = "●"; }
      const desc = x.solved ? "solved" : (x.selected !== null ? "answered" : (x.showHint ? "needs a new answer" : "unanswered"));
      return `<button class="qpill ${cls}" data-go="${i}" aria-current="${i === state.cur}" aria-label="Question ${i + 1}, ${desc}">Q${i + 1}${x.q.hard ? "🔥" : ""} ${label}</button>`;
    }).join("");

    const opts = s.order.map((oid, i) => {
      const o = s.q.options.find(x => x.id === oid);
      const checked = s.selected === oid;
      const isCorrect = s.solved && oid === s.q.correct;
      const tried = !s.solved && s.tried.has(oid);
      const cls = ["opt", isCorrect ? "correct" : "", tried ? "tried" : ""].join(" ");
      const tag = isCorrect ? `<span class="tag">✔ CORRECT</span>` : (tried ? `<span class="tag">✖ tried</span>` : "");
      return `<button class="${cls}" role="radio" data-opt="${oid}" aria-checked="${checked}"
                ${s.solved ? 'aria-disabled="true"' : ""} tabindex="${(checked || (s.selected === null && i === 0)) ? 0 : -1}">
                <span class="letter" aria-hidden="true">${LETTERS[i]}</span>
                <span class="otext"><span class="sr-only">${LETTERS[i]}. </span>${esc(o.text)}</span>${tag}
              </button>`;
    }).join("");

    let notes = "";
    if (s.solved) {
      notes = `<div class="note why"><strong>✔ Locked in. Why:</strong>${esc(s.q.why)}</div>`;
    } else if (s.showHint) {
      notes = `<div class="note hint" role="status"><strong>✖ Not quite. Retry hint:</strong>${esc(s.q.hint)}</div>`;
    }

    const flash = state.flash ? `<div class="flash ${state.flash.kind}" role="status">${esc(state.flash.text)}</div>` : `<div class="flash"></div>`;

    app.innerHTML = `
      <div class="status">
        <div class="set-title">Set ${set.id}: ${esc(set.title)}</div>
        <div class="stat">Score <b>${setScore()}</b>/15</div>
        <div class="stat">Solved <b>${solvedCount}</b>/5</div>
        <div class="stat">Wrong attempts on Q${state.cur + 1}: <b>${s.wrong}</b></div>
      </div>
      <nav class="qnav" aria-label="Questions">${pills}</nav>
      <section class="qcard ${s.solved ? "locked" : ""}" aria-labelledby="qtext">
        <div class="qhead">
          <span>Question ${state.cur + 1} of 5</span>
          ${s.q.hard ? `<span class="hard-tag">🔥 Hard</span>` : ""}
        </div>
        <div class="qtext" id="qtext">${esc(s.q.text)}</div>
        <div class="options" role="radiogroup" aria-labelledby="qtext">${opts}</div>
        ${notes}
      </section>
      ${flash}
      <div class="controls">
        <div class="nav">
          <button class="btn" id="prevBtn" ${state.cur === 0 ? "disabled" : ""}>← Prev</button>
          <button class="btn" id="nextBtn" ${state.cur === 4 ? "disabled" : ""}>Next →</button>
        </div>
        ${allChosen
          ? `<button class="btn primary big" id="submitBtn">Submit set</button>`
          : `<span class="muted">${state.qs.some(x => x.showHint && x.selected === null)
              ? "Pick a new answer for each ✖ question to submit"
              : "Answer all 5 questions to submit"}</span>`}
      </div>`;

    app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { state.flash = null; goTo(+b.dataset.go); });
    app.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => choose(b.dataset.opt));
    document.getElementById("prevBtn").onclick = () => { state.flash = null; goTo(state.cur - 1); };
    document.getElementById("nextBtn").onclick = () => { state.flash = null; goTo(state.cur + 1); };
    const submitBtn = document.getElementById("submitBtn");
    if (submitBtn) submitBtn.onclick = submit;
  }

  function choose(oid) {
    const s = state.qs[state.cur];
    if (s.solved) return;
    s.selected = oid;
    state.flash = null;
    renderPlay(false);
    const btn = app.querySelector(`[data-opt="${oid}"]`);
    if (btn) btn.focus();
  }

  function submit() {
    // Submit only works once every unsolved question has a fresh answer (also guards the Enter key).
    if (state.qs.some(x => !x.solved && x.selected === null)) return;
    let newlySolved = 0, wrongNow = 0;
    state.qs.forEach(x => {
      if (x.solved) return;
      if (x.selected === x.q.correct) {
        x.solved = true;
        x.showHint = false;
        newlySolved++;
      } else {
        x.wrong += 1;
        x.tried.add(x.selected);
        x.selected = null;
        x.showHint = true;
        wrongNow++;
      }
    });
    if (wrongNow === 0) { finishSet(); return; }
    const firstWrong = state.qs.findIndex(x => !x.solved);
    state.flash = {
      text: `${5 - wrongNow} of 5 correct and locked. ${wrongNow} wrong (−${wrongNow}). Fix ${wrongNow === 1 ? "it" : "them"} and submit again.`,
      kind: "bad"
    };
    goTo(firstWrong);
    announce(state.flash.text + " Now on question " + (firstWrong + 1) + ". Hint: " + state.qs[firstWrong].q.hint);
    app.focus();
  }

  function finishSet() {
    const score = setScore();
    reportToHub({
      status: "pass", score, maxScore: 15,
      attempts: state.qs.reduce((t, x) => t + x.wrong, 0),
      hints: state.qs.filter(x => x.wrong > 0).length,
      durationSec: state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : undefined,
      details: { set: SETS[state.setIdx].id, rank: rankFor(score, 15) }
    });
    renderFinal(setScore(), state.qs.map(x => ({ wrong: x.wrong, score: qScore(x), text: x.q.text, hard: x.q.hard })));
  }

  function breakdownTable(rows) {
    return `<table class="breakdown">
      <thead><tr><th>#</th><th>Question</th><th class="num">Wrong attempts</th><th class="num">Points</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr><td>Q${i + 1}${r.hard ? "🔥" : ""}</td><td>${esc(r.text)}</td><td class="num">${r.wrong}</td><td class="num">${r.score}/3</td></tr>`).join("")}</tbody>
    </table>`;
  }

  function renderFinal(score, rows) {
    state.screen = "final";
    const set = SETS[state.setIdx];
    app.innerHTML = `
      <h1><span class="kicker">Final edition · Set ${set.id} cleared</span>${esc(set.title)}</h1>
      <div class="card">
        <div class="muted">Your score</div>
        <div class="score-big">${score}<small> / 15</small></div>
        <div class="rank">${rankFor(score, 15)}</div>
        ${breakdownTable(rows)}
      </div>
      <div class="card">
        <h2>Your code</h2>
        <div class="code-box" aria-label="Code: ${esc(FINAL_CODE.split("").join(" "))}">${esc(FINAL_CODE)}</div>
      </div>
      <div class="card">
        <h2>Debrief</h2>
        <p class="debrief">${esc(DEBRIEF)}</p>
      </div>
      <p><button class="btn" id="againBtn">Next team (back to start)</button></p>`;
    document.getElementById("againBtn").onclick = renderStart;
    document.getElementById("againBtn").focus();
    announce(`Set cleared. Score ${score} out of 15. Rank: ${rankFor(score, 15)}. Your code is ${FINAL_CODE}.`);
  }

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (state.screen !== "play") return;
    const s = state.qs[state.cur];

    const li = LETTERS.indexOf(k.toUpperCase());
    if (li !== -1 && k.length === 1) {
      e.preventDefault();
      if (!s.solved) choose(s.order[li]);
      return;
    }
    if (/^[1-5]$/.test(k)) { e.preventDefault(); state.flash = null; goTo(+k - 1); return; }
    if (k === "ArrowRight" && state.cur < 4 && !e.target.closest(".options")) { e.preventDefault(); state.flash = null; goTo(state.cur + 1); return; }
    if (k === "ArrowLeft" && state.cur > 0 && !e.target.closest(".options")) { e.preventDefault(); state.flash = null; goTo(state.cur - 1); return; }
    // Arrow keys inside the radiogroup move between options, like native radios.
    if (["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(k) && e.target.closest(".options")) {
      e.preventDefault();
      const btns = [...app.querySelectorAll("[data-opt]")];
      const idx = btns.indexOf(e.target.closest("[data-opt]"));
      const step = (k === "ArrowDown" || k === "ArrowRight") ? 1 : -1;
      const next = btns[(idx + step + btns.length) % btns.length];
      if (s.solved) next.focus(); else choose(next.dataset.opt);
      return;
    }
    // Enter submits, unless focus is on a button that has its own action (other than an option).
    if (k === "Enter") {
      const b = e.target.closest("button");
      if (b && !b.hasAttribute("data-opt") && b.id !== "submitBtn") return;
      e.preventDefault();
      submit();
    }
  });

  renderStart();
})();
</script>
</body>
</html>
